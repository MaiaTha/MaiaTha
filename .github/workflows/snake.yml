name: Generate Snake Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # roda todo dia à meia-noite (UTC)
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Gerar animação da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23D4AF37&color_dots=%23E5DEFA,%23C4AAF0,%23A78BFA,%238B5CF6,%236B46C1&color_background=%23FFFFFF
            dist/github-snake-dark.svg?color_snake=%23D4AF37&color_dots=%233d3255,%235b4a85,%237c5cbf,%23a78bfa,%23c4aaf0&color_background=%231a1a2e

      - name: Publicar na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
