name: Generate Snake Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # roda todo dia à meia-noite (UTC)
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Gerar animação da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#D4AF37&color_dots=#E5DEFA,#C4AAF0,#A78BFA,#8B5CF6,#6B46C1&color_background=#FFFFFF
            dist/github-snake-dark.svg?color_snake=#D4AF37&color_dots=#3d3255,#5b4a85,#7c5cbf,#a78bfa,#c4aaf0&color_background=#1a1a2e

      - name: Publicar na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
